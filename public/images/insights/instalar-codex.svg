<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Tres rutas para empezar con Codex</title>
  <desc id="desc">Aplicación, terminal y editor conducen a un proyecto que se puede revisar.</desc>
  <rect width="1200" height="675" fill="#013762"/>
  <path d="M0 540h1200" stroke="#47DAD6" stroke-opacity=".25"/>
  <text x="85" y="110" fill="#47DAD6" font-family="Arial,sans-serif" font-size="25" font-weight="700">CODEX · PRIMEROS PASOS</text>
  <text x="85" y="176" fill="#fff" font-family="Arial,sans-serif" font-size="48" font-weight="700">Elige dónde trabajar</text>
  <g font-family="Arial,sans-serif" font-weight="700" font-size="31" text-anchor="middle">
    <rect x="85" y="268" width="290" height="190" rx="20" fill="#e7f3f9"/>
    <rect x="455" y="268" width="290" height="190" rx="20" fill="#0179b1"/>
    <rect x="825" y="268" width="290" height="190" rx="20" fill="#47dad6"/>
    <text x="230" y="373" fill="#013762">Aplicación</text>
    <text x="600" y="373" fill="#fff">Terminal</text>
    <text x="970" y="373" fill="#013762">Editor</text>
  </g>
  <g stroke="#47DAD6" stroke-width="4" fill="none">
    <path d="M230 458v63h370"/>
    <path d="M600 458v63"/>
    <path d="M970 458v63H600"/>
  </g>
  <circle cx="600" cy="521" r="10" fill="#47dad6"/>
  <text x="600" y="601" fill="#fff" font-family="Arial,sans-serif" font-size="30" text-anchor="middle">Un proyecto · un resultado revisable</text>
</svg>
